name: C++ CI/CD

permissions:
  contents: write

on:
  push:
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v1.0.* ]]; then
            N=${GITHUB_REF#refs/tags/v1.0.}
          else
            N=${{ github.run_number }}
          fi
          echo "VERSION=1.0.$N" >> $GITHUB_ENV

      - name: Configure CMake
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPROJECT_VERSION=${{ env.VERSION }}

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifact
          cp build/Lab1 artifact/Lab1-v${{ env.VERSION }}-linux

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifact
          cp build/Release/Lab1.exe artifact/Lab1-v${{ env.VERSION }}-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab1-${{ matrix.name }}-v${{ env.VERSION }}
          path: artifact/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true