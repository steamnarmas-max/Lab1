name: C++ CI/CD

on:
  push:
    tags: 
      - 'v*'
  pull_request:

jobs:
  build-and-test:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine and set VERSION
        shell: python
        run: |
          import os
          ref = os.environ["GITHUB_REF"]
          run_number = os.environ["GITHUB_RUN_NUMBER"]

          if ref.startswith("refs/tags/"):
              tag = ref.split("/")[-1]
              if tag.startswith("v"):
                  version = tag[1:]      # например, v1.0.5 → 1.0.5
              else:
                  version = f"1.0.{run_number}"
          else:
              version = f"1.0.{run_number}"

          print(f"Building version: {version}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"VERSION={version}\n")
              f.write(f"TAG_NAME={tag}\n") 

      - name: Cache CMake
        uses: actions/cache@v3
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPROJECT_VERSION=${{ env.VERSION }}

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare artifacts
        run: |
          mkdir -p artifact
          if [ "${{ runner.os }}" == "Linux" ]; then
            cp build/Lab1 artifact/Lab1-v${{ env.VERSION }}-linux
          else
            cp build/Release/Lab1.exe artifact/Lab1-v${{ env.VERSION }}-windows.exe
          fi

      - name: Upload artifact (for Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: Lab1-v${{ env.VERSION }}-${{ runner.os }}
          path: artifact/
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts from build jobs
        uses: actions/download-artifact@v3
        with:
          path: downloaded_artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.VERSION }}
          body: |
            собранный релиз для версии ${{ env.VERSION }}.
            
            Артефакты:
            - Lab1-v${{ env.VERSION }}-linux
            - Lab1-v${{ env.VERSION }}-windows.exe
          files: |
            downloaded_artifacts/Lab1-v${{ env.VERSION }}-linux/Lab1-v${{ env.VERSION }}-linux
            downloaded_artifacts/Lab1-v${{ env.VERSION }}-windows/Lab1-v${{ env.VERSION }}-windows.exe