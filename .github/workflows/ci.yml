name: C++ CI/CD

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            exe_path: ./build/Lab1
          - os: windows-latest
            name: Windows
            exe_path: ./build/Release/Lab1.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPROJECT_VERSION=1.0.${{ github.run_number }}

      - name: Build
        run: cmake --build build --config Release

      - name: Run program (Linux)
        if: runner.os == 'Linux'
        run: ${{ matrix.exe_path }}

      - name: Run program (Windows)
        if: runner.os == 'Windows'
        run: ${{ matrix.exe_path }}
        shell: pwsh