name: C++ CI/CD

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v1.0.* ]]; then
            N=${GITHUB_REF#refs/tags/v1.0.}
          else
            N=${{ github.run_number }}
          fi
          echo "VERSION=1.0.$N" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Configure CMake
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPROJECT_VERSION=${{ env.VERSION }}

      - name: Build
        run: cmake --build build --config Release

      - name: Run program
        run: ./build/Release/Lab1.exe
        if: runner.os == 'Windows'

      - name: Run program
        run: ./build/Lab1
        if: runner.os == 'Linux'