name: C++ CI/CD

permissions:
  contents: write

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v1.0.* ]]; then
            N=${GITHUB_REF#refs/tags/v1.0.}
          else
            N=${{ github.run_number }}
          fi
          echo "VERSION=1.0.$N" >> $GITHUB_ENV
          echo "Building version: 1.0.$N"

      - name: Configure CMake
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPROJECT_VERSION=${{ env.VERSION }}

      - name: Build
        run: cmake --build build --config Release

      - name: Run program (Linux)
        if: runner.os == 'Linux'
        run: ./build/Lab1

      - name: Run program (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/Lab1.exe

      - name: Prepare artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifact
          cp build/Lab1 artifact/Lab1-v${{ env.VERSION }}-linux

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifact
          cp build/Release/Lab1.exe artifact/Lab1-v${{ env.VERSION }}-windows.exe

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Lab1-v${{ env.VERSION }}-linux
          path: artifact/Lab1-v${{ env.VERSION }}-linux
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Lab1-v${{ env.VERSION }}-windows
          path: artifact/Lab1-v${{ env.VERSION }}-windows.exe
          if-no-files-found: error

      - name: Create and push tag
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ env.VERSION }}$"; then
            echo "Tag v${{ env.VERSION }} already exists, skipping"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ env.VERSION }}
          git push origin v${{ env.VERSION }}
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact/Lab1-v${{ env.VERSION }}-linux
            artifact/Lab1-v${{ env.VERSION }}-windows.exe
          generate_release_notes: true